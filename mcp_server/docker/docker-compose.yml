services:
  postgres-age:
    build:
      context: ../..
      dockerfile: docker/postgres-age/Dockerfile
    ports:
      - "${POSTGRES_AGE_PORT:-55432}:5432"
    environment:
      POSTGRES_USER: graphiti
      POSTGRES_PASSWORD: graphiti
      POSTGRES_DB: graphiti
    volumes:
      - postgres_age_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphiti -d graphiti"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  graphiti-mcp:
    build:
      context: ../..
      dockerfile: mcp_server/docker/Dockerfile.standalone
    depends_on:
      postgres-age:
        condition: service_healthy
    environment:
      # Database configuration - use postgres_age provider
      - DATABASE_PROVIDER=postgres_age
      - POSTGRES_AGE_DSN=${POSTGRES_AGE_DSN:-postgresql://graphiti:graphiti@postgres-age:5432/graphiti}
      - POSTGRES_AGE_GRAPH_NAME=${POSTGRES_AGE_GRAPH_NAME:-graphiti}
      - POSTGRES_AGE_EMBEDDING_DIMENSION=${POSTGRES_AGE_EMBEDDING_DIMENSION:-384}
      # Application configuration
      - GRAPHITI_GROUP_ID=${GRAPHITI_GROUP_ID:-main}
      - SEMAPHORE_LIMIT=${SEMAPHORE_LIMIT:-10}
      - CONFIG_PATH=/app/mcp/config/config.yaml
      - PATH=/root/.local/bin:${PATH}
      # LLM configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.minimaxi.com/v1}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-MiniMax-M2.7}
    volumes:
      - ./config/config-docker-postgres-age.yaml:/app/mcp/config/config.yaml:ro
      - mcp_logs:/var/log/graphiti
    ports:
      - "8000:8000"
    command: ["uv", "run", "main.py"]

volumes:
  postgres_age_data:
    driver: local
  mcp_logs:
    driver: local