# Graphiti MCP Server Configuration for Oracle Linux Deployment
# Optimized for offline deployment with external PostgreSQL AGE, remote embedding API, and OpenAI-compatible LLM

server:
  transport: "http"  # HTTP transport (SSE is deprecated)
  host: "0.0.0.0"
  port: 8000

llm:
  provider: "openai"
  model: ${OPENAI_MODEL_NAME:MiniMax-M2.7}
  max_tokens: ${OPENAI_MAX_TOKENS:16384}  # Reasoning models need a large budget; 4096 causes empty-output failures
  use_generic_client: true  # Use chat/completions only — MiniMax does not support /v1/responses

  providers:
    openai:
      api_key: ${OPENAI_API_KEY:-}
      api_url: ${OPENAI_BASE_URL:-https://api.minimaxi.com/v1}

embedder:
  provider: "openai"  # Use remote embedding service via OpenAI-compatible API
  model: ${EMBEDDING_MODEL:all-MiniLM-L6-v2}
  dimensions: ${EMBEDDING_DIM:384}

  providers:
    openai:
      api_key: "not-needed"
      api_url: ${EMBEDDING_API_URL:-http://localhost:8080/v1}

database:
  provider: "postgres_age"  # Using external PostgreSQL + Apache AGE

  providers:
    postgres_age:
      dsn: ${POSTGRES_AGE_DSN:postgresql://graphiti:graphiti@localhost:55432/graphiti}
      graph_name: ${POSTGRES_AGE_GRAPH_NAME:graphiti}
      embedding_dimension: ${POSTGRES_AGE_EMBEDDING_DIMENSION:384}

graphiti:
  group_id: ${GRAPHITI_GROUP_ID:main}
  user_id: ${USER_ID:mcp_user}
  entity_types:
    - name: "Preference"
      description: "User preferences, choices, opinions, or selections (PRIORITIZE over most other types except User/Assistant)"
    - name: "Requirement"
      description: "Specific needs, features, or functionality that must be fulfilled"
    - name: "Procedure"
      description: "Standard operating procedures and sequential instructions"
    - name: "Location"
      description: "Physical or virtual places where activities occur"
    - name: "Event"
      description: "Time-bound activities, occurrences, or experiences"
    - name: "Organization"
      description: "Companies, institutions, groups, or formal entities"
    - name: "Document"
      description: "Information content in various forms (books, articles, reports, etc.)"
    - name: "Topic"
      description: "Subject of conversation, interest, or knowledge domain (use as last resort)"
    - name: "Object"
      description: "Physical items, tools, devices, or possessions (use as last resort)"
