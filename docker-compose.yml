# Graphiti Docker Compose — 管理 server、mcp-server 和 web-service
#
# 前置依赖（需提前启动）：
#   1. pg-age 数据库：cd /path/to/pg-age && docker compose up -d
#      容器内通过 host.docker.internal + 宿主机端口访问
#   2. embedding-service：本地已启动的 embedding 服务（默认 http://localhost:8080）
#
# 启动方式：
#   docker compose --profile all up -d          # 同时启动 server + mcp-server + web-service
#   docker compose --profile server up -d       # 仅启动 server
#   docker compose --profile mcp-server up -d   # 仅启动 mcp-server
#   docker compose --profile web-service up -d  # 仅启动 web-service

services:
  # Graphiti REST API Server
  server:
    profiles: ["server", "all"]
    build:
      context: .
    image: graphiti-server:latest
    container_name: graphiti-server
    ports:
      - "${SERVER_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # LLM 配置
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.minimaxi.com/v1}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-MiniMax-M2.7}
      - USE_GENERIC_CLIENT=${USE_GENERIC_CLIENT:-true}
      # Embedding 配置 — 使用外部 embedding-service
      - EMBEDDER_PROVIDER=${EMBEDDER_PROVIDER:-openai}
      - EMBEDDING_API_URL=${EMBEDDING_API_URL:-http://host.docker.internal:8080/v1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      # PostgreSQL AGE 数据库配置 — 通过 host.docker.internal 访问宿主机
      - POSTGRES_AGE_DSN=${POSTGRES_AGE_DSN:-postgresql://graphiti:graphiti@host.docker.internal:5432/graphiti}
      - POSTGRES_AGE_GRAPH_NAME=${POSTGRES_AGE_GRAPH_NAME:-graphiti}
      - POSTGRES_AGE_EMBEDDING_DIMENSION=${POSTGRES_AGE_EMBEDDING_DIMENSION:-384}
      # 服务配置
      - PORT=8000
      - DATABASE_PROVIDER=postgres_age
      # 可观测性 — OTel trace 导出到 collector
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-graphiti-server}
      - OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-dev}
      - DEPLOYMENT_ENVIRONMENT=${DEPLOYMENT_ENVIRONMENT:-development}
      # Chat 搜索参数
      - CHAT_SIM_MIN_SCORE=${CHAT_SIM_MIN_SCORE:-0.2}
      - CHAT_SEARCH_LIMIT=${CHAT_SEARCH_LIMIT:-10}
      - CHAT_BFS_MAX_DEPTH=${CHAT_BFS_MAX_DEPTH:-3}
    networks:
      - default
      - observability

  # Graphiti MCP Server
  mcp-server:
    profiles: ["mcp-server", "all"]
    image: graphiti-mcp-server:amd64
    container_name: graphiti-mcp-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 数据库配置
      - DATABASE_PROVIDER=postgres_age
      - POSTGRES_AGE_DSN=${POSTGRES_AGE_DSN:-postgresql://graphiti:graphiti@host.docker.internal:5432/graphiti}
      - POSTGRES_AGE_GRAPH_NAME=${POSTGRES_AGE_GRAPH_NAME:-graphiti}
      - POSTGRES_AGE_EMBEDDING_DIMENSION=${POSTGRES_AGE_EMBEDDING_DIMENSION:-384}
      - GRAPHITI_DELETE_EXISTING=${GRAPHITI_DELETE_EXISTING:-false}
      # 应用配置
      - GRAPHITI_GROUP_ID=${GRAPHITI_GROUP_ID:-main}
      - SEMAPHORE_LIMIT=${SEMAPHORE_LIMIT:-10}
      - CONFIG_PATH=/app/mcp/config/config.yaml
      - PATH=/root/.local/bin:${PATH}
      # LLM 配置
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.minimaxi.com/v1}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-MiniMax-M2.7}
      - USE_GENERIC_CLIENT=${USE_GENERIC_CLIENT:-true}
      - OPENAI_MAX_TOKENS=${OPENAI_MAX_TOKENS:-16384}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-600}
      # Embedding — 使用外部 embedding-service
      - EMBEDDER_PROVIDER=${EMBEDDER_PROVIDER:-openai}
      - EMBEDDING_API_URL=${EMBEDDING_API_URL:-http://host.docker.internal:8080/v1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      # 禁用代理（避免 SOCKS5 兼容性问题）
      - NO_PROXY=*
      - no_proxy=*
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - ALL_PROXY=
    volumes:
      - ./mcp_server/config/config-docker-postgres-age.yaml:/app/mcp/config/config.yaml:ro
      - mcp_logs:/var/log/graphiti
    ports:
      - "${MCP_PORT:-8001}:8000"
    command: ["uv", "run", "main.py"]

  # Graphiti Web UI (Next.js)
  web-service:
    profiles: ["web-service", "all"]
    platform: linux/amd64
    build:
      context: ./web_service
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: graphiti-web-base:node20-amd64
    image: graphiti-web-service:latest
    container_name: graphiti-web-service
    ports:
      - "${WEB_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=3000
      - NODE_ENV=production
      # 后端服务地址（Docker 容器间通信使用容器名）
      - PYTHON_API_URL=http://graphiti-server:8000
      - GRAPHITI_MCP_URL=http://graphiti-mcp-server:8000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  # ===== OpenTelemetry Collector =====
  otel-collector:
    profiles: ["observability", "all"]
    platform: linux/amd64
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: graphiti-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      - OTEL_TRACE_SAMPLING_PERCENTAGE=${OTEL_TRACE_SAMPLING_PERCENTAGE:-100}
    volumes:
      - ./observability/otel-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - greptime
    networks:
      - observability
    restart: unless-stopped

  # ===== GreptimeDB (traces + metrics + logs 统一存储) =====
  greptime:
    profiles: ["observability", "all"]
    platform: linux/amd64
    image: greptime/greptimedb:v1.1.0
    container_name: graphiti-greptime
    command: ["standalone", "start", "--http-addr=0.0.0.0:4000", "--grpc-bind-addr=0.0.0.0:4001", "--mysql-addr=0.0.0.0:4002"]
    volumes:
      - greptime-data:/tmp/greptimedb
    ports:
      - "4000:4000"
      - "4002:4002"
      - "4001:4001"
    networks:
      - observability
    restart: unless-stopped

  # ===== Grafana =====
  grafana:
    profiles: ["observability", "all"]
    platform: linux/amd64
    image: grafana/grafana:11.1.0
    container_name: graphiti-grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./observability/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana-datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    depends_on:
      - greptime
    networks:
      - observability
    restart: unless-stopped

volumes:
  mcp_logs:
  greptime-data:
  profiling-data:

networks:
  observability:
